<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriChef AI ⚡ Culinary & Nutrition Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --bg-base: #0c0f17;
    --bg-surface: #141926;
    --bg-surface-elevated: #1d2436;
    --accent: #8b5cf6;
    --accent-glow: rgba(139, 92, 246, 0.35);
    --accent-gradient: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #3b82f6 100%);
    --neon-green: #10b981;
    --neon-coral: #f43f5e;
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.09);
    --border-hover: rgba(168, 85, 247, 0.4);
    --bubble-user: linear-gradient(135deg, #7c3aed 0%, #d946ef 100%);
    --bubble-agent: #182032;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 40%);
  }

  /* Header */
  header {
    background: rgba(12, 15, 23, 0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1.6rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .brand-logo {
    font-size: 1.5rem;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: -0.5px;
  }
  .badge {
    background: rgba(16, 185, 129, 0.15);
    color: var(--neon-green);
    border: 1px solid rgba(16, 185, 129, 0.3);
    padding: 0.2rem 0.6rem;
    border-radius: 9999px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .sub-tagline {
    font-size: 0.8rem;
    color: var(--text-muted);
    display: none;
  }
  @media (min-width: 600px) {
    .sub-tagline { display: inline; }
  }

  /* Chat Log */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    scroll-behavior: smooth;
  }

  .msg {
    display: flex;
    flex-direction: column;
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-items: flex-end;
  }
  .msg.agent {
    align-items: flex-start;
  }

  .sender-label {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 0.3rem;
    padding: 0 0.3rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .bubble {
    display: inline-block;
    padding: 0.9rem 1.25rem;
    border-radius: var(--radius-lg);
    background: var(--bubble-agent);
    border: 1px solid var(--border);
    color: var(--text-primary);
    line-height: 1.6;
    font-size: 0.95rem;
    max-width: 88%;
    word-break: break-word;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
  }

  .msg.user .bubble {
    background: var(--bubble-user);
    color: #fff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 18px var(--accent-glow);
  }

  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    box-shadow: none;
    width: 100%;
  }

  /* --- A2UI Card Styling with GenZ Modern aesthetic --- */
  .a2card {
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: var(--radius-lg);
    padding: 1.3rem;
    background: linear-gradient(145deg, #182032 0%, #131929 100%);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    max-width: 100%;
    position: relative;
    overflow: hidden;
  }
  .a2card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: var(--accent-gradient);
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.8rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.6rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .a2text.a2-h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
  }
  .a2text.a2-h3 { font-size: 1.1rem; font-weight: 600; color: #e2e8f0; }
  .a2text.a2-h4 { font-size: 1rem; font-weight: 600; color: #cbd5e1; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  
  .a2img {
    max-width: 100%;
    border-radius: var(--radius-md);
    display: block;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    margin: 0.4rem 0;
  }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-size: 1.3rem;
    line-height: 1;
    vertical-align: middle;
    color: #c084fc;
  }

  /* Bottom Controls Area */
  .chat-bottom {
    background: rgba(12, 15, 23, 0.9);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    padding: 0.8rem 1.2rem 1.1rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }

  /* Quick Prompts Row */
  .suggestions-row {
    display: flex;
    gap: 0.55rem;
    overflow-x: auto;
    padding-bottom: 0.2rem;
    scrollbar-width: none;
  }
  .suggestions-row::-webkit-scrollbar { display: none; }

  .chip-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    color: #e2e8f0;
    padding: 0.45rem 0.85rem;
    border-radius: 9999px;
    font-size: 0.82rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .chip-btn:hover {
    background: rgba(168, 85, 247, 0.15);
    border-color: var(--accent);
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 2px 10px var(--accent-glow);
  }
  .chip-icon {
    font-size: 0.95rem;
  }

  /* Input form */
  form {
    display: flex;
    gap: 0.6rem;
    position: relative;
  }
  input {
    flex: 1;
    padding: 0.85rem 1.2rem;
    background: #141926;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: #fff;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
  }
  input:focus {
    border-color: #a855f7;
    box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
    background: #182032;
  }
  input::placeholder {
    color: #64748b;
  }

  .send-btn {
    padding: 0.85rem 1.4rem;
    border: none;
    border-radius: var(--radius-md);
    background: var(--accent-gradient);
    color: #fff;
    font-weight: 700;
    font-size: 0.92rem;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    transition: all 0.2s ease;
    box-shadow: 0 4px 14px rgba(168, 85, 247, 0.3);
  }
  .send-btn:hover {
    opacity: 0.93;
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(168, 85, 247, 0.45);
  }
  .send-btn:active {
    transform: translateY(0);
  }

  /* Loading animation */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0.4rem 0.2rem;
  }
  .typing-dot {
    width: 6px;
    height: 6px;
    background: #a855f7;
    border-radius: 50%;
    animation: typingBounce 1.4s infinite ease-in-out both;
  }
  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1.1); opacity: 1; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-logo">🥗 NutriChef AI</span>
    <span class="badge">Gen-Z Vibe</span>
    <span class="sub-tagline">Chef Nutritionist • Macro Solver • Visual Culinary Lab</span>
  </div>
</header>

<div id="log"></div>

<div class="chat-bottom">
  <!-- Clickable tailored example prompts row -->
  <div class="suggestions-row">
    <button type="button" class="chip-btn" data-prompt="Calculate my daily macro targets: 25yo female, 140 lbs, 5'6, moderate workout, goal is lean muscle">
      <span class="chip-icon">🎯</span> Calc My Macros
    </button>
    <button type="button" class="chip-btn" data-prompt="Suggest a high-protein keto dinner recipe and plate it with an image">
      <span class="chip-icon">🍳</span> High-Protein Keto Dinner + Visual
    </button>
    <button type="button" class="chip-btn" data-prompt="Search for avocado salmon bowl recipes and show calories and prep time">
      <span class="chip-icon">🥑</span> Avocado Salmon Bowl Details
    </button>
  </div>

  <form id="form">
    <input id="input" placeholder="Ask about recipes, macro calculations, dietary advice..." autocomplete="off" autofocus>
    <button class="send-btn" type="submit">
      <span>Send</span>
      <span style="font-size: 1.1rem; line-height: 1;">⚡</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const chips = document.querySelectorAll(".chip-btn");

chips.forEach(btn => {
  btn.addEventListener("click", () => {
    const prompt = btn.getAttribute("data-prompt");
    if (prompt) {
      input.value = prompt;
      form.dispatchEvent(new Event("submit", { cancelable: true }));
    }
  });
});

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  const m = el("div", "msg " + who);
  const label = el("div", "sender-label", who === "user" ? "You" : "NutriChef AI");
  const b = el("div", "bubble");
  m.appendChild(label);
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) {
    for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  }
  return ids;
}

function iconName(n) {
  return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase();
}

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card");
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col");
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img");
      img.src = src;
      img.alt = boundStr(props.alt) || "NutriChef Visual";
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined");
      s.textContent = iconName(boundStr(props.name) || props.name);
      return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) {
      for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
    }
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) {
      const spec = comps[id];
      childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c));
    }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) {
    const node = buildNode(rid, comps, new Set());
    if (node) {
      container.appendChild(node);
      drew = true;
    }
  }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) {
      for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
    }
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) {
      b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
    }
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  
  const b = bubble("agent");
  const typing = el("div", "typing-indicator");
  typing.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  b.appendChild(typing);

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
